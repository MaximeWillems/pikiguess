name: Données

on: workflow_dispatch

permissions:
  contents: write

jobs:
  donnees:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Télécharger les vecteurs (Fauconnier) et Lexique 3.83
        run: |
          mkdir -p data-src
          curl -fsSL -o data-src/vecteurs.bin https://embeddings.net/embeddings/frWac_non_lem_no_postag_no_phrase_200_skip_cut100.bin
          curl -fsSL -o data-src/Lexique383.tsv http://www.lexique.org/databases/Lexique383/Lexique383.tsv
          sha256sum data-src/*
      - run: python tools/prepare_data.py data-src/vecteurs.bin data-src/Lexique383.tsv public/data
      - name: Ajouter les données au dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "Données préparées"
          git push
